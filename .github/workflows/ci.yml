name: Test and deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-runtime.txt
      - name: Install dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Unit, integration and mocked-agent tests
        run: pytest -q
      - name: Verify frozen model
        run: python scripts/verify_model.py
  runtime-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Install Render runtime and test runner
        run: |
          python -m pip install -r requirements-runtime.txt pytest==8.3.5
          python -m pip check
      - name: Confirm training dependencies are absent
        run: python -c "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('torch', 'xgboost', 'catboost', 'jupyter'))"
      - name: Load frozen model without training dependencies
        run: python scripts/verify_model.py
      - name: Runtime unit, integration and mocked-agent tests
        run: pytest -q --ignore=tests/test_training.py
  deploy:
    needs: [test, runtime-test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Deploy tested commit and check live health
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: python scripts/deploy.py
