name: Test and deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-runtime.txt
      - name: Install dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Unit, integration and mocked-agent tests
        run: pytest -q
      - name: Verify frozen model
        run: python scripts/verify_model.py
  runtime-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Run render.yaml's build command (installs runtime, verifies model)
        run: |
          build="$(sed -n 's/^    buildCommand: //p' render.yaml)"
          test -n "$build"
          sh -c "$build"
      - name: Install test runner
        run: |
          python -m pip install pytest==8.3.5
          python -m pip check
      - name: Confirm training dependencies are absent
        run: python -c "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('torch', 'xgboost', 'catboost', 'jupyter'))"
      - name: Runtime unit, integration and mocked-agent tests
        run: pytest -q --ignore=tests/test_training.py
      - name: Start with render.yaml's start command and check /health
        env:
          PORT: '10000'
          FLASK_SECRET_KEY: ci-only-not-a-secret
          GUNICORN_CMD_ARGS: '--access-logfile -'
          RENDER_GIT_COMMIT: ${{ github.sha }}
        run: |
          start="$(sed -n 's/^    startCommand: //p' render.yaml)"
          test -n "$start"
          sh -c "$start" > gunicorn.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fs http://127.0.0.1:10000/health > health.json; then
              python -c "import json, os; health = json.load(open('health.json')); assert health['status'] == 'ok' and health['commit'] == os.environ['RENDER_GIT_COMMIT'], health"
              exit 0
            fi
            sleep 1
          done
          cat gunicorn.log
          exit 1
  container-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Build production Docker image
        run: docker build --file Dockerfile.runtime --tag ml-project-runtime .
      - name: Verify production HTTP and model tools under Free plan limits
        run: python scripts/check_container.py --image ml-project-runtime --cpus 0.1 --output artifacts/container-check.json
  deploy:
    needs: [test, runtime-test, container-test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Deploy tested commit and check live health
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: python scripts/deploy.py
